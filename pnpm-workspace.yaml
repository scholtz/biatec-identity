# pnpm settings (this is not a multi-package workspace; the file carries config)

# Supply-chain protections:
# Only packages approved below may run install/postinstall scripts;
# everything else has lifecycle scripts blocked (pnpm default since v10).
# - cypress: downloads its binary in postinstall
# - esbuild: installs its platform binary
# - vue-demi: postinstall selects the Vue 3 build
# - @parcel/watcher: denied — ships prebuilt binaries as optional deps, script is a source-build fallback
# - core-js: denied — postinstall only prints a funding banner
allowBuilds:
  '@parcel/watcher': false
  core-js: false
  cypress: true
  esbuild: true
  vue-demi: true

# Security overrides for vulnerable transitive dependencies:
# - form-data <4.0.4: unsafe random boundary (GHSA critical)
# - shell-quote <1.8.4: quote() does not escape newlines (GHSA critical)
overrides:
  'form-data@4': '>=4.0.4'
  'shell-quote@1': '>=1.8.4'

# Refuse to install any package version published less than 7 days ago,
# giving the ecosystem time to catch and unpublish compromised releases.
minimumReleaseAge: 10080
